[project]
name = "curator-health"
version = "0.1.0"
description = "Label-free reward-health checks for RL with verifiable rewards (RLVR): does your reward actually depend on the prompt?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CURATOR team" }]
dependencies = []          # stdlib only: nothing to add to a training environment

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=1.26", "ruff>=0.5"]

[project.scripts]
curator-health = "curator_health.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["curator_health*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
