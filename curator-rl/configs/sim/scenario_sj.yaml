# S-J (Roadmap v3 section 3.3 H6, Phase C): the HOMOGENEOUS twin of S-I.
# Identical dynamics, sizes and budget; every arm costs the same (S-I's mean unit cost).
# Question: when costs are equal, does Curator match Uniform (DataFlex-RL finds adaptive
# policies tie uniform)? A tie here is the EXPECTED result, not a failure.
scenario_id: S-J
description: S-I dynamics with equal unit costs (homogeneous regime)
budget_usd: 9.5
max_rounds: 200
steps_per_round: 5
prompts_per_step: 16
group_size: 8
world:
  skill_noise_std: 0.003
  cost_lognormal_sigma: 0.10
  rollout_concentration: 25.0
  benchmark_items: 200
calib:
  enabled: false
oracle:
  simplex_step: 0.1
  random_search_draws: 1500
envs:
  - env_id: gsm8k
    nominal_size: 6873
    difficulty: -0.4
    eta: 0.006
    cost_usd_per_prompt: 0.0017
    transfer_out: {math35: 0.3}
  - env_id: math35
    nominal_size: 4700
    difficulty: 0.8
    eta: 0.005
    cost_usd_per_prompt: 0.0017
    transfer_out: {gsm8k: 0.3}
  - env_id: mbpp
    nominal_size: 974
    difficulty: 0.4
    eta: 0.005
    cost_usd_per_prompt: 0.0017
  - env_id: countdown
    nominal_size: 5000
    difficulty: 1.0
    eta: 0.004
    cost_usd_per_prompt: 0.0017
  - env_id: noisy
    nominal_size: 6873
    eta: 0.01
    cost_usd_per_prompt: 0.0017
    noisy_q: 0.30
  - env_id: too_hard
    nominal_size: 5000
