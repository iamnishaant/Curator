# S-B (Roadmap F.3): the 8-env full-portfolio analogue, including noisy and
# too-hard. Question: realistic overall comparison.
scenario_id: S-B
description: 8 envs incl. noisy + too-hard + gated + interfering; junk-waste test
budget_usd: 2.0
max_rounds: 200
steps_per_round: 5
prompts_per_step: 16
group_size: 8
world:
  skill_noise_std: 0.003
  cost_lognormal_sigma: 0.10
  rollout_concentration: 25.0
  benchmark_items: 200
calib:
  enabled: false
oracle:
  simplex_step: 0.1
  random_search_draws: 1500
envs:
  - env_id: easy
    nominal_size: 6873   # declared, position-assigned (D-63)
    difficulty: -1.2
    eta: 0.015
    cost_usd_per_prompt: 0.001
  - env_id: v1
    nominal_size: 7500   # declared, position-assigned (D-63)
    difficulty: 0.4
    eta: 0.012
    cost_usd_per_prompt: 0.001
  - env_id: v2
    nominal_size: 974   # declared, position-assigned (D-63)
    difficulty: 0.8
    eta: 0.012
    cost_usd_per_prompt: 0.001
  - env_id: medium
    nominal_size: 6873   # declared, position-assigned (D-63)
    difficulty: 0.0
    eta: 0.012
    cost_usd_per_prompt: 0.001
  - env_id: delayed
    nominal_size: 3000   # declared, position-assigned (D-63)
    difficulty: 0.2
    eta: 0.015
    cost_usd_per_prompt: 0.001
    gate: {prereq: v1, theta: 0.8, slope: 4.0}
  - env_id: noisy
    nominal_size: 374   # declared, position-assigned (D-63)
    eta: 0.01
    cost_usd_per_prompt: 0.001
    noisy_q: 0.30
  - env_id: too_hard
    nominal_size: 5000   # declared, position-assigned (D-63)
    difficulty: 4.0      # p0 = sigmoid(-8) ~= 0, zero-signal arm
    eta: 0.01
    cost_usd_per_prompt: 0.0015
  - env_id: interferer
    nominal_size: 2000   # declared, position-assigned (D-63)
    difficulty: 0.6
    eta: 0.012
    cost_usd_per_prompt: 0.001
    transfer_out: {v1: -0.4}   # negative transfer on v1
