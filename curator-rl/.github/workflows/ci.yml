name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (CPU only, GPU tests deselected)
        run: python -m pytest tests -m "not gpu"
